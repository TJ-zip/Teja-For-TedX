name: validate

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect lockfile
        id: lock
        run: |
          if [ -f package-lock.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node (with cache)
        if: steps.lock.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Node (no lockfile yet)
        if: steps.lock.outputs.found != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: |
          if [ "${{ steps.lock.outputs.found }}" = "true" ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: |
          if node -e "process.exit(require('./package.json').scripts.lint?0:1)"; then
            npm run lint
          else
            echo "no lint script - skipped"
          fi

      - name: Typecheck
        run: |
          if node -e "process.exit(require('./package.json').scripts.typecheck?0:1)"; then
            npm run typecheck
          else
            echo "no typecheck script - skipped"
          fi

      - name: Test
        run: |
          if node -e "process.exit(require('./package.json').scripts.test?0:1)"; then
            npm test
          else
            echo "no test script - skipped"
          fi

      - name: Build
        run: |
          if node -e "process.exit(require('./package.json').scripts.build?0:1)"; then
            npm run build
          else
            echo "::error::no build script declared in package.json"
            exit 1
          fi
